name: Update FCI IGP 2026 Results

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 selenium

      - name: Fetch official FCI results
        run: python update_scores.py

      - name: Commit updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json
          if git diff --cached --quiet; then
            echo "No score changes"
          else
            git commit -m "Update FCI IGP 2026 scores"
            git push
          fi
